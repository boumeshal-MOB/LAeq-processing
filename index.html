<body>
<header><div class="wrap"><h1>LAeq Processor — SONO / Micromate</h1><p class="lead">Démo front-end 100% navigateur : drag & drop d’un CSV, détection du format, calcul énergétique LAeq,T, affichage tableur et téléchargement CSV. Aucune installation locale requise.</p></div></header>

<script>

function dbToEnergy(v){return Math.pow(10, Number(v)/10)}

function fmtDate(d){if(!(d instanceof Date)||isNaN(d))return ''; const pad=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}

function cleanNumber(value){if(value==null)return null; const s=String(value).replace(',','.'); const m=s.match(/-?\d+(\.\d+)?/); return m?Number(m[0]):null}
function parseCsvLine(line, sep){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i],n=line[i+1];if(c==='"'&&q&&n==='"'){cur+='"';i++}else if(c==='"'){q=!q}else if(c===sep&&!q){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out}
function splitLines(text){return text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim().length>0)}

function detectSource(text){const head=text.slice(0,8000); if(head.includes('Full Histogram') && head.includes('Geophone') && head.includes('Mic')) return 'micromate_raw'; if(head.includes('CUBE') || head.includes('Time;LAeq') || head.includes('LASeqT')) return 'cube_sono'; return 'unknown'}
function parseCube(text, fileName){const lines=splitLines(text); if(lines.length<2) throw new Error('Fichier CUBE vide ou incomplet.'); const first=lines[0]; let dm=first.match(/(\d{4})[\/\-](\d{2})[\/\-](\d{2})/); if(!dm && fileName) dm=fileName.match(/(\d{4})(\d{2})(\d{2})/); if(!dm) throw new Error('CUBE/SONO : date non trouvée dans la première ligne ou le nom du fichier.'); const date=`${dm[1]}-${dm[2]}-${dm[3]}`; let headerIndex=lines.findIndex(l=>l.includes('Time') && l.includes('LAeq')); if(headerIndex<0) throw new Error('CUBE/SONO : colonnes Time et LAeq introuvables.'); const sep=detectSeparator(lines[headerIndex]); const header=parseCsvLine(lines[headerIndex],sep); const timeIdx=header.findIndex(h=>h.trim()==='Time'); const laeqIdx=header.findIndex(h=>h.trim()==='LAeq'); if(timeIdx<0||laeqIdx<0) throw new Error('CUBE/SONO : colonne Time ou LAeq manquante.'); const rows=[]; for(let i=headerIndex+1;i<lines.length;i++){const cols=parseCsvLine(lines[i],sep); const t=cols[timeIdx]; if(!/^\d{2}:\d{2}:\d{2}$/.test(t||'')) continue; const v=cleanNumber(cols[laeqIdx]); if(v==null||Number.isNaN(v)) continue; rows.push({timestamp:new Date(`${date}T${t}`), value_dba:v})} return {sourceType:'cube_sono', metric:'LAeq', rows:rows.sort((a,b)=>a.timestamp-b.timestamp)}}
function parseMicromate(text){const lines=splitLines(text); const parsed=lines.map(l=>parseCsvLine(l,',')); const tableStart=parsed.findIndex(r=>r.some(c=>c==='Tran') && r.some(c=>c==='Geophone') && r.some(c=>c==='Mic')); if(tableStart<0) throw new Error('Micromate : en-tête du tableau de données introuvable.'); const h1=parsed[tableStart], h2=parsed[tableStart+1], h3=parsed[tableStart+2]; const maxLen=Math.max(h1.length,h2.length,h3.length); const cols=[]; for(let i=0;i<maxLen;i++){const a=h1[i]||'', b=h2[i]||'', c=h3[i]||''; if(c==='Time'||b==='Time'||a==='Time') cols.push('timestamp'); else cols.push([a,b,c].filter(Boolean).join('_'))} const timeIdx=cols.indexOf('timestamp'); const leqIdx=cols.findIndex(c=>c.toLowerCase().includes('mic') && c.toLowerCase().includes('leq')); if(timeIdx<0||leqIdx<0) throw new Error('Micromate : timestamp ou colonne Mic Leq introuvable.'); const rows=[]; for(let i=tableStart+3;i<parsed.length;i++){const r=parsed[i]; const ts=new Date(r[timeIdx]); const v=cleanNumber(r[leqIdx]); if(!isNaN(ts.getTime())&&v!=null&&!isNaN(v)) rows.push({timestamp:ts,value_dba:v})} return {sourceType:'micromate_raw', metric:'Mic Leq dB(A)', rows:rows.sort((a,b)=>a.timestamp-b.timestamp)}}

function estimateResolution(rows){if(rows.length<2)return null; const ds=[]; for(let i=1;i<rows.length;i++){const d=(rows[i].timestamp-rows[i-1].timestamp)/1000;if(d>0&&isFinite(d))ds.push(d)} if(!ds.length)return null; ds.sort((a,b)=>a-b); return ds[Math.floor(ds.length/2)]}
function floorMs(ms,sec){return Math.floor(ms/(sec*1000))*sec*1000} function ceilMs(ms,sec){return Math.ceil(ms/(sec*1000))*sec*1000}

function computeRolling(rows,cfg){const res=estimateResolution(rows)||1; const expected=Math.max(1,cfg.windowSeconds/res); const rolling=[]; let left=0, sumE=0; for(let right=0;right<rows.length;right++){const end=rows[right].timestamp; const startMs=end.getTime()-cfg.windowSeconds*1000; sumE+=dbToEnergy(rows[right].value_dba); while(left<=right && rows[left].timestamp.getTime()<=startMs){sumE-=dbToEnergy(rows[left].value_dba); left++} const count=right-left+1; const coverage=count/expected*100; if(coverage+1e-9>=cfg.minCoverage){rolling.push({timestamp:end,period_start:new Date(startMs),period_end:end,LAeq_dBA:energyToDb(sumE/count),sample_count:count,expected_count:Math.round(expected),coverage_percent:coverage,mode:'rolling'})}}

function rowsToCsv(rows){const h=['timestamp','LAeq_dBA']; return [h.join(','), ...rows.map(r=>`${fmtDate(r.timestamp)},${r.LAeq_dBA.toFixed(3)}`)].join('\n')}
function download(name,content){const blob=new Blob([content],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url)}

 const processText=(txt,f)=>{setErr('');setMsg('');setResults([]);try{const p=parseByType(txt,f?.name||'',cfg.sourceType); setParsed(p); setMsg(`Fichier reconnu : ${p.sourceType}. ${p.rows.length} mesures exploitables.`)}catch(ex){setParsed(null);setErr(ex.message)}};
