name: LAeq V3 tests

on:
  pull_request:
    paths:
      - 'index-v3.html'
      - 'v3-*.js'
      - 'v3.css'
      - 'tests/**'
      - '.github/workflows/laeq-v3-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check v3-core.js
          node --check v3-app.js

      - name: Run calculation and UI tests
        run: |
          node tests/v3-core.test.mjs
          node tests/v3-ui.test.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run browser interaction tests
        run: python tests/v3-browser.test.py
